<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tuinhuisje Frame 3D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; overflow:hidden; touch-action:none; font-family:monospace; color:#fff; }
canvas { position:fixed; top:0; left:0; outline:none; display:block; }

#infoBtn {
  position:fixed; top:12px; left:12px;
  background:#222; border:1px solid #555; color:#ffe066;
  font-family:serif; font-size:18px; font-style:italic; font-weight:bold;
  width:36px; height:36px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:10;
}

#legend {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.92);
  display:none; flex-direction:column; gap:6px;
  padding:60px 24px 24px; font-size:14px;
  overflow-y:auto; z-index:30;
}
#legend.open { display:flex; }
#legend .closeBtn {
  position:fixed; top:12px; right:12px;
  background:#222; border:1px solid #555; color:#fff;
  width:36px; height:36px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:18px;
}
.row { display:flex; align-items:center; gap:10px; line-height:1.4; }
.sq { width:16px; height:16px; border-radius:3px; flex-shrink:0; }
.sub { opacity:0.65; font-size:12px; margin-left:26px; margin-top:-2px; }
.sect { font-weight:bold; color:#ffe066; font-size:14px; margin-top:14px; padding-bottom:4px; border-bottom:1px solid #444; }
.sect:first-child { margin-top:0; }

#toggleBtn {
  position:fixed; bottom:52px; left:50%; transform:translateX(-50%);
  background:#222; border:1px solid #555; color:#ffe066;
  font-family:monospace; font-size:13px; padding:8px 20px;
  border-radius:20px; cursor:pointer; z-index:10;
}
#toggleBtn.on { background:#2a2a00; border-color:#ffe066; }

#pauseBtn {
  position:fixed; bottom:52px; right:16px;
  background:#222; border:1px solid #555; color:#ffe066;
  font-family:monospace; font-size:16px; padding:6px 14px;
  border-radius:50%; cursor:pointer; z-index:10;
  width:42px; height:42px; display:flex; align-items:center; justify-content:center;
}

#tip { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); font-size:10px; opacity:.4; white-space:nowrap; pointer-events:none; }

/* Tooltip popup when tapping a beam */
#tooltip {
  position:fixed; display:none; pointer-events:none;
  background:rgba(0,0,0,0.85); border:1px solid #ffe066;
  color:#ffe066; font-size:13px; font-family:monospace;
  padding:6px 14px; border-radius:8px;
  transform:translate(-50%,-120%);
  white-space:nowrap; z-index:20;
}

/* Floating dimension labels (shown when toggle ON) */
.mlab {
  position:fixed; pointer-events:none;
  font-size:9.5px; font-family:monospace;
  background:rgba(0,0,0,0.7); color:#ffe066;
  padding:1px 5px; border-radius:3px;
  border:1px solid rgba(255,220,80,0.25);
  transform:translate(-50%,-50%);
  white-space:nowrap; display:none;
}
</style>
</head>
<body>

<button id="infoBtn" title="Info over houtsoorten">i</button>

<div id="legend">
  <div class="closeBtn" id="closeLegend">✕</div>
  <div class="sect">🟫 Paal 68×68mm</div>
  <div class="row"><div class="sq" style="background:#c8722a"></div>Hoekpalen</div>
  <div class="sub">4 stuks van 240cm</div>

  <div class="sect">🟩 Regel 44×68mm</div>
  <div class="row"><div class="sq" style="background:#3a9e4a"></div>Onderregel</div>
  <div class="row"><div class="sq" style="background:#4a80c8"></div>Bovenregel</div>
  <div class="row"><div class="sq" style="background:#d4a017"></div>Dakspanten</div>
  <div class="row"><div class="sq" style="background:#a06030"></div>Tussenregel / stutten</div>
  <div class="row"><div class="sq" style="background:#e85c20"></div>Deurframe</div>
  <div class="sub">6× 400cm + 21× 300cm</div>

  <div class="sect">⬜ Rabatdelen 18×145mm</div>
  <div class="sub">Wandbekleding (niet zichtbaar in 3D)</div>
  <div class="sub">20× 420cm + 62× 300cm</div>
</div>

<button id="toggleBtn">📐 Toon alle maten</button>
<button id="pauseBtn" title="Pauzeer rotatie">⏸</button>
<div id="tooltip"></div>
<div id="tip">Tik = maat &nbsp;|&nbsp; 1 vinger = draai &nbsp;|&nbsp; 2 vingers = pan/zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Scene ──────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.01, 50);

// Camera target (what we're looking at) — panning moves this and the camera together
const target = new THREE.Vector3(0, 1.1, 0);

// Dynamically size camera to fit shed regardless of aspect ratio
function fitCamera() {
  const aspect = innerWidth / innerHeight;
  camera.aspect = aspect;
  const fov = camera.fov * Math.PI / 180;
  const fovH = 2 * Math.atan(Math.tan(fov/2) * aspect);
  const shedSize = 5.2;
  const dist = (shedSize / 2) / Math.tan(Math.min(fov, fovH) / 2) * 1.15;
  const dir = new THREE.Vector3(0, 0.35, 1).normalize();
  camera.position.copy(target).addScaledVector(dir, dist);
  camera.lookAt(target);
  camera.updateProjectionMatrix();
}
fitCamera();

// Zoom: move camera closer/further from target
function zoomCam(factor) {
  const offset = new THREE.Vector3().subVectors(camera.position, target);
  const newLen = offset.length() * factor;
  if(newLen < 1.5 || newLen > 40) return;
  offset.multiplyScalar(factor);
  camera.position.copy(target).add(offset);
  camera.lookAt(target);
}

// Pan: translate camera + target in screen-space
function panCam(dxScreen, dyScreen) {
  const distance = camera.position.distanceTo(target);
  const fov = camera.fov * Math.PI / 180;
  const worldH = 2 * distance * Math.tan(fov / 2);
  const scale = worldH / innerHeight;
  const right = new THREE.Vector3();
  const up    = new THREE.Vector3();
  camera.matrix.extractBasis(right, up, new THREE.Vector3());
  const v = new THREE.Vector3()
    .addScaledVector(right, -dxScreen * scale)
    .addScaledVector(up,     dyScreen * scale);
  target.add(v);
  camera.position.add(v);
  camera.lookAt(target);
}

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xfffbe0, 0.85);
sun.position.set(5,10,6); scene.add(sun);
scene.add(new THREE.DirectionalLight(0xc8deff, 0.25)).position.set(-4,2,-4);
scene.add(new THREE.GridHelper(12,24,0x232323,0x1b1b1b));

// Group — everything rotates together
const g = new THREE.Group();
g.position.x = 0;
scene.add(g);

// ── Materials (DoubleSide so raycasting works from all angles) ─────────────
function mkMat(c){
  return new THREE.MeshLambertMaterial({ color:c, side:THREE.DoubleSide });
}

// ── Beam registry for raycasting + labels ──────────────────────────────────
const beamMeshes = []; // all beam meshes
const beamLabels = []; // { mesh, labelText, midWorld }

function beam(x1,y1,z1, x2,y2,z2, color, label='', bw=0.065, bh=0.065){
  const A = new THREE.Vector3(x1,y1,z1);
  const B = new THREE.Vector3(x2,y2,z2);
  const len = A.distanceTo(B);
  const mid = A.clone().lerp(B, 0.5);
  const dir = B.clone().sub(A).normalize();
  const geo = new THREE.BoxGeometry(bw, len, bh);
  const m = new THREE.Mesh(geo, mkMat(color));
  m.position.copy(mid);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  m.userData.label = label;
  m.userData.origColor = color;
  g.add(m);
  beamMeshes.push(m);
  beamLabels.push({ mesh:m, text:label, mid:mid.clone() });
  return m;
}

// ── Dimensions ─────────────────────────────────────────────────────────────
const SW=3.70, SD=2.80;
const hF=2.40, hB=1.90;
const ox=-SW/2, oz=-SD/2;

// Colors
const PAAL=0xc8722a, ONDER=0x3a9e4a, BOVEN=0x4a80c8;
const DAK=0xd4a017, TUS=0xa06030, DEUR=0xe85c20;

// Door: 1.60 wide, 2.00 high, centered on front wall
const DW=1.60, DH=2.00;
const dL=-DW/2, dR=DW/2;   // -0.80, +0.80
const dz=oz+SD+0.02;        // in front of front wall (visual only)

// Slant lengths
const sideSlant = Math.sqrt(SD*SD + (hF-hB)*(hF-hB)); // ~2.84m
const m2 = s => `${s.toFixed(2)} m`;

// ── HOEKPALEN ──────────────────────────────────────────────────────────────
beam(ox,      0, oz+SD,  ox,      hF, oz+SD,  PAAL, `Hoekpaal voorkant-links: ${m2(hF)}`,    0.08,0.08);
beam(ox+SW,   0, oz+SD,  ox+SW,   hF, oz+SD,  PAAL, `Hoekpaal voorkant-rechts: ${m2(hF)}`,   0.08,0.08);
beam(ox+SW,   0, oz,     ox+SW,   hB, oz,     PAAL, `Hoekpaal achterkant-rechts: ${m2(hB)}`,  0.08,0.08);
beam(ox,      0, oz,     ox,      hB, oz,     PAAL, `Hoekpaal achterkant-links: ${m2(hB)}`,   0.08,0.08);

// ── ONDERREGEL ─────────────────────────────────────────────────────────────
const oy=0.06;
beam(ox,oy,oz+SD,   ox+SW,oy,oz+SD, ONDER, `Onderregel voorkant: ${m2(SW)}`);
beam(ox,oy,oz,      ox+SW,oy,oz,    ONDER, `Onderregel achterkant: ${m2(SW)}`);
beam(ox,oy,oz+SD,   ox,oy,oz,       ONDER, `Onderregel linkerzijde: ${m2(SD)}`);
beam(ox+SW,oy,oz+SD,ox+SW,oy,oz,    ONDER, `Onderregel rechterzijde: ${m2(SD)}`);

// ── BOVENREGEL ─────────────────────────────────────────────────────────────
beam(ox,hF,oz+SD,    ox+SW,hF,oz+SD,  BOVEN, `Bovenregel voorkant: ${m2(SW)}`);
beam(ox,hB,oz,       ox+SW,hB,oz,     BOVEN, `Bovenregel achterkant: ${m2(SW)}`);
beam(ox,hF,oz+SD,    ox,hB,oz,        BOVEN, `Bovenregel linkerzijde (schuin): ${m2(sideSlant)}`);
beam(ox+SW,hF,oz+SD, ox+SW,hB,oz,     BOVEN, `Bovenregel rechterzijde (schuin): ${m2(sideSlant)}`);

// ── TUSSENREGEL ~1.10m ─────────────────────────────────────────────────────
// FRONT WALL: !! split around door opening !!
const frontLeftLen  = Math.abs(dL - ox);        // ox(-1.85) → dL(-0.80)
const frontRightLen = Math.abs((ox+SW) - dR);   // dR(0.80) → ox+SW(1.85)
beam(ox,1.1,oz+SD,  dL,1.1,oz+SD,       TUS, `Tussenregel voorkant-links: ${m2(frontLeftLen)}`);
beam(dR,1.1,oz+SD,  ox+SW,1.1,oz+SD,    TUS, `Tussenregel voorkant-rechts: ${m2(frontRightLen)}`);
// Back, left, right walls — full length
beam(ox,1.1,oz,     ox+SW,1.1,oz,       TUS, `Tussenregel achterkant: ${m2(SW)}`);
beam(ox,1.1,oz+SD,  ox,1.1,oz,          TUS, `Tussenregel linkerzijde: ${m2(SD)}`);
beam(ox+SW,1.1,oz+SD,ox+SW,1.1,oz,      TUS, `Tussenregel rechterzijde: ${m2(SD)}`);

// ── VERTICALE STUTTEN ─────────────────────────────────────────────────────
// Front wall: only OUTSIDE the door
// Left stud — at ox+0.80 = -1.05, which is left of dL=-0.80 ✓
const lsX = ox + 0.80;
beam(lsX, 0, oz+SD, lsX, hF, oz+SD, TUS, `Stut voorkant-links: ${m2(hF)}`, 0.05,0.05);
// Right stud — at ox+SW-0.80 = 1.05, which is right of dR=0.80 ✓
const rsX = ox+SW - 0.80;
beam(rsX, 0, oz+SD, rsX, hF, oz+SD, TUS, `Stut voorkant-rechts: ${m2(hF)}`, 0.05,0.05);

// Back wall studs
const b1x = ox+1.10, b2x = ox+2.60;
beam(b1x,0,oz, b1x,hB,oz, TUS, `Stut achterkant-links: ${m2(hB)}`, 0.05,0.05);
beam(b2x,0,oz, b2x,hB,oz, TUS, `Stut achterkant-rechts: ${m2(hB)}`, 0.05,0.05);

// Side wall mid studs
const sideH = (hF+hB)/2;
const sideStutH = Math.sqrt(0 + sideH*sideH); // just height
beam(ox,   0, oz+1.4, ox,   sideH, oz+1.4, TUS, `Stut linkerzijde: ${m2(sideH)}`, 0.05,0.05);
beam(ox+SW,0, oz+1.4, ox+SW,sideH, oz+1.4, TUS, `Stut rechterzijde: ${m2(sideH)}`, 0.05,0.05);

// ── DAKSPANTEN ─────────────────────────────────────────────────────────────
for(let i=0; i<=5; i++){
  const x = ox + (SW/5)*i;
  beam(x,hF,oz+SD, x,hB,oz, DAK, `Dakspant ${i+1} van 6: ${m2(sideSlant)}`, 0.055,0.055);
}

// ── DEUROPENING ────────────────────────────────────────────────────────────
// Vertical posts
beam(dL, 0, dz, dL, DH, dz, DEUR, `Deurpost links: ${m2(DH)}`,   0.055,0.055);
beam(dR, 0, dz, dR, DH, dz, DEUR, `Deurpost rechts: ${m2(DH)}`,  0.055,0.055);
// Top rail
beam(dL, DH, dz, dR, DH, dz, DEUR, `Deurlat bovenkant: hoogte ${m2(DH)}, breedte ${m2(DW)}`, 0.055,0.055);
// Middle split
beam(0, 0, dz, 0, DH, dz, DEUR, `Deurmiddenstijl (2 vleugels): ${m2(DH)}`, 0.04,0.04);

// ── HTML floating label divs (one per beam) ────────────────────────────────
const mlabEls = beamLabels.map(bl => {
  const div = document.createElement('div');
  div.className = 'mlab';
  // Short version of label for the floating dot
  const short = bl.text.split(':')[1]?.trim() || bl.text;
  div.textContent = short;
  document.body.appendChild(div);
  return div;
});

// ── Toggle button ──────────────────────────────────────────────────────────
let showAllLabels = false;
const toggleBtn = document.getElementById('toggleBtn');
function toggleLabels(e){
  if(e){e.preventDefault(); e.stopPropagation();}
  showAllLabels = !showAllLabels;
  toggleBtn.textContent = showAllLabels ? '📐 Verberg maten' : '📐 Toon alle maten';
  toggleBtn.classList.toggle('on', showAllLabels);
  mlabEls.forEach(el => el.style.display = showAllLabels ? 'block' : 'none');
}
toggleBtn.addEventListener('click', toggleLabels);
toggleBtn.addEventListener('touchend', toggleLabels);

const pauseBtn = document.getElementById('pauseBtn');
function togglePause(e){
  if(e){e.preventDefault(); e.stopPropagation();}
  autoSpin = !autoSpin;
  pauseBtn.textContent = autoSpin ? '⏸' : '▶';
}
pauseBtn.addEventListener('click', togglePause);
pauseBtn.addEventListener('touchend', togglePause);

const infoBtn = document.getElementById('infoBtn');
const legend = document.getElementById('legend');
const closeLegend = document.getElementById('closeLegend');

function openLegend(e){ if(e){e.preventDefault(); e.stopPropagation();} legend.classList.add('open'); }
function hideLegend(e){ if(e){e.preventDefault(); e.stopPropagation();} legend.classList.remove('open'); }

infoBtn.addEventListener('click', openLegend);
infoBtn.addEventListener('touchend', openLegend);
closeLegend.addEventListener('click', hideLegend);
closeLegend.addEventListener('touchend', hideLegend);
legend.addEventListener('click', e => { if(e.target === legend) hideLegend(e); });

// ── Tooltip + raycasting ───────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse2d = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let selectedMesh = null;
const HIGHLIGHT = 0xffffff;

function getScreenXY(clientX, clientY){
  mouse2d.x = (clientX / innerWidth)  *  2 - 1;
  mouse2d.y = (clientY / innerHeight) * -2 + 1;
}

function doRaycast(clientX, clientY){
  getScreenXY(clientX, clientY);
  raycaster.setFromCamera(mouse2d, camera);
  const hits = raycaster.intersectObjects(beamMeshes, false);

  // Deselect previous
  if(selectedMesh){
    selectedMesh.material.color.setHex(selectedMesh.userData.origColor);
    selectedMesh = null;
  }
  tooltip.style.display = 'none';

  if(hits.length > 0){
    const hit = hits[0].object;
    if(hit.userData.label){
      selectedMesh = hit;
      hit.material.color.setHex(HIGHLIGHT);
      tooltip.textContent = hit.userData.label;
      tooltip.style.left = clientX + 'px';
      tooltip.style.top  = clientY + 'px';
      tooltip.style.display = 'block';
    }
  }
}

// ── Controls (drag / tap distinction) ─────────────────────────────────────
let rotY=0.45, rotX=-0.12;
let autoSpin=true, drag=false;
let lx=0, ly=0, pinch=null, pinchMidX=0, pinchMidY=0;
let touchStartX=0, touchStartY=0, touchMoved=false;

function applyRot(){
  g.rotation.y = rotY;
  g.rotation.x = Math.max(-0.5, Math.min(0.55, rotX));
}
applyRot();

const el = renderer.domElement;

// Mouse
el.addEventListener('mousedown', e=>{
  drag=true; autoSpin=false; lx=e.clientX; ly=e.clientY;
});
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  rotY+=(e.clientX-lx)*0.009; rotX+=(e.clientY-ly)*0.009;
  lx=e.clientX; ly=e.clientY; applyRot();
});
window.addEventListener('mouseup', e=>{
  drag=false;
});
el.addEventListener('click', e=>{
  doRaycast(e.clientX, e.clientY);
});
el.addEventListener('wheel', e=>{
  zoomCam(1 + e.deltaY * 0.001);
},{passive:true});

// Touch
el.addEventListener('touchstart', e=>{
  autoSpin=false;
  if(e.touches.length===1){
    drag=true;
    lx=e.touches[0].clientX; ly=e.touches[0].clientY;
    touchStartX=lx; touchStartY=ly; touchMoved=false;
  } else if(e.touches.length===2){
    drag=false;
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    pinch=Math.sqrt(dx*dx+dy*dy);
    pinchMidX=(e.touches[0].clientX+e.touches[1].clientX)/2;
    pinchMidY=(e.touches[0].clientY+e.touches[1].clientY)/2;
  }
},{passive:true});

el.addEventListener('touchmove', e=>{
  if(e.touches.length===1&&drag){
    const dx=e.touches[0].clientX-lx, dy=e.touches[0].clientY-ly;
    rotY+=dx*0.009; rotX+=dy*0.009;
    lx=e.touches[0].clientX; ly=e.touches[0].clientY; applyRot();
    if(Math.abs(e.touches[0].clientX-touchStartX)>8 || Math.abs(e.touches[0].clientY-touchStartY)>8) touchMoved=true;
  } else if(e.touches.length===2&&pinch!==null){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.sqrt(dx*dx+dy*dy);
    const midX=(e.touches[0].clientX+e.touches[1].clientX)/2;
    const midY=(e.touches[0].clientY+e.touches[1].clientY)/2;
    zoomCam(pinch/d);
    panCam(midX - pinchMidX, midY - pinchMidY);
    pinch=d; pinchMidX=midX; pinchMidY=midY;
  }
},{passive:true});

el.addEventListener('touchend', e=>{
  // If finger barely moved → it's a tap → raycast
  if(!touchMoved && e.changedTouches.length===1){
    doRaycast(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }
  drag=false; pinch=null; touchMoved=false;
},{passive:true});

// ── Project 3D label positions to screen ──────────────────────────────────
const tmpV = new THREE.Vector3();
function updateFloatingLabels(){
  if(!showAllLabels) return;
  beamLabels.forEach((bl, i) => {
    tmpV.copy(bl.mid);
    // Apply the group's rotation matrix to get world position
    tmpV.applyMatrix4(g.matrixWorld);
    tmpV.project(camera);
    if(tmpV.z > 1){ mlabEls[i].style.display='none'; return; }
    mlabEls[i].style.display='block';
    mlabEls[i].style.left = ((tmpV.x * 0.5 + 0.5) * innerWidth)  + 'px';
    mlabEls[i].style.top  = ((tmpV.y *-0.5 + 0.5) * innerHeight) + 'px';
  });
}

// ── Render loop ────────────────────────────────────────────────────────────
(function animate(){
  requestAnimationFrame(animate);
  if(autoSpin){ rotY+=0.004; applyRot(); }
  g.updateMatrixWorld();
  renderer.render(scene, camera);
  updateFloatingLabels();
})();

window.addEventListener('resize',()=>{
  fitCamera();
  renderer.setSize(innerWidth,innerHeight);
});
// Force correct sizing after initial layout settles (mobile WebView quirk)
setTimeout(()=>{ fitCamera(); renderer.setSize(innerWidth,innerHeight); }, 100);
</script>
</body>
</html>
